# Every setting comes from an env var with a local default (DEPLOY.md), so the app runs locally with no env changes.
server:
  port: ${PORT:8080}
  # Honour X-Forwarded-* from Render's HTTPS proxy (scheme, host, client IP).
  forward-headers-strategy: framework

spring:
  application:
    name: cinecircle-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cinecircle}
      auto-index-creation: true
      gridfs:
        bucket: images
  servlet:
    multipart:
      # Deliberately above app.images.max-bytes: oversized images reach the image guard, which answers
      # 400 VALIDATION_ERROR "Image must be under N MB". Anything bigger still gets the same 400 from the
      # MaxUploadSizeExceededException handler.
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: always

app:
  # Public base URL of this backend, used to build absolute image URLs ({base}/api/images/{id}).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  tmdb:
    # Optional at startup: without it the app boots with a warning, movie endpoints return
    # 502 TMDB_UNAVAILABLE and seeding skips posts.
    token: ${TMDB_API_TOKEN:}
    base-url: https://api.themoviedb.org/3
    timeout: 5s
  jwt:
    secret: ${JWT_SECRET}
    ttl: 7d
  seed: ${APP_SEED:true}
  llm:
    # Optional. Anthropic API key for AI review summaries + spoiler detector. Blank = both AI features off.
    # Deliberately NOT ANTHROPIC_API_KEY (Claude Code reads that one).
    api-key: ${CINECIRCLE_LLM_API_KEY:}
    model: ${LLM_MODEL:claude-haiku-5-5}
    # Sends "thinking":{"type":"disabled"} so thinking tokens don't eat max_tokens. Must be set to false for models
    # that reject disabled thinking (Opus 5.5, Sonnet 5.5, Fable); the field is then omitted.
    thinking-disabled: ${LLM_THINKING_DISABLED:true}
    # Max Anthropic calls per UTC day across the whole app (collection llm_usage). Above it the AI behaves as disabled.
    daily-call-limit: ${LLM_DAILY_CALL_LIMIT:150}
  images:
    max-bytes: ${IMAGE_MAX_BYTES:5242880}
    # Uploads are refused with 507 STORAGE_FULL once the GridFS "images" bucket reaches this size.
    storage-limit-mb: ${IMAGE_STORAGE_LIMIT_MB:300}
  limits:
    posts-per-day: ${LIMIT_POSTS_PER_DAY:10}
    comments-per-day: ${LIMIT_COMMENTS_PER_DAY:50}
    register-per-hour-per-ip: ${LIMIT_REGISTER_PER_HOUR:5}
    login-per-minute-per-ip: ${LIMIT_LOGIN_PER_MINUTE:10}
  scheduling:
    # Background jobs (spoiler retry/backfill every 2 min). Disabled in tests.
    enabled: true
  cors:
    # Comma-separated list of allowed frontend origins.
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    com.cinecircle: INFO
