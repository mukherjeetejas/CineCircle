# Test configuration. Shadows src/main/resources/application.yml on the test classpath.
# No spring.data.mongodb.uri: flapdoodle starts an embedded MongoDB and wires host/port.
spring:
  data:
    mongodb:
      database: cinecircle_test
      auto-index-creation: true
      gridfs:
        bucket: images
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14

app:
  public-url: http://localhost:8080
  tmdb:
    token: test-token
    base-url: http://localhost:1/3
    timeout: 1s
  jwt:
    secret: test-secret-test-secret-test-secret-1234
    ttl: 7d
  seed: false
  llm:
    # blank = LLM disabled; tests that need it mock LlmClient
    api-key: ""
    model: test-model
  scheduling:
    enabled: false
  cors:
    origins: http://localhost:5173

logging:
  level:
    org.mongodb.driver: WARN
    de.flapdoodle: WARN
